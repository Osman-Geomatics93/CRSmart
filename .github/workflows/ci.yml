name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy qgis-stubs numpy pyproj types-setuptools
      - name: Ruff (lint)
        run: ruff check crsmart tests
      - name: Black (format check)
        run: black --check crsmart tests
      - name: Mypy (static types)
        run: mypy crsmart

  qt6-check:
    name: Qt5/Qt6 compatibility checker
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/oslandia/qgis/pyqgis-4-checker:latest
    steps:
      - uses: actions/checkout@v4
      # The Oslandia image ships the official pyqt5->pyqt6 checker. The exact
      # entrypoint is confirmed/pinned in Phase 6; see TODO.md. The build must
      # fail on any reported incompatibility.
      - name: Run Qt6 compatibility checker
        run: |
          set -euo pipefail
          if command -v pyqgis-4-checker >/dev/null 2>&1; then
            pyqgis-4-checker crsmart
          else
            python3 /opt/pyqt5_to_pyqt6.py crsmart
          fi

  test:
    name: Tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis:
          - "release-3_40" # QGIS 3.40 LTR (Qt5)
          - "latest"       # QGIS 4.x (Qt6)
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip3 install --break-system-packages \
            pytest pytest-qgis pytest-cov pyproj numpy || \
          pip3 install pytest pytest-qgis pytest-cov pyproj numpy
      - name: Run test suite
        run: |
          xvfb-run -a python3 -m pytest -ra --cov=crsmart --cov-report=term-missing

  package:
    name: Build & verify plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build zip
        run: python scripts/build_zip.py
      - name: Verify zip structure
        run: python -m pytest tests/test_packaging.py -ra
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crsmart-plugin-zip
          path: dist/*.zip

  release:
    name: Release to QGIS plugin repository
    needs: [lint, qt6-check, test, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci
      # Publishes the tagged release to the OSGeo plugin repo and attaches the
      # zip to the GitHub release. Requires repository secrets:
      #   OSGEO_USERNAME / OSGEO_PASSWORD (plugins.qgis.org credentials).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          qgis-plugin-ci release "${GITHUB_REF_NAME}" \
            --github-token "${GITHUB_TOKEN}" \
            --osgeo-username "${OSGEO_USERNAME}" \
            --osgeo-password "${OSGEO_PASSWORD}"
