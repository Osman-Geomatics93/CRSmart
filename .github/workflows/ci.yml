name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy qgis-stubs numpy pyproj types-setuptools
      - name: Ruff (lint)
        run: ruff check crsmart tests
      - name: Ruff (format check)
        run: ruff format --check crsmart tests
      - name: Mypy (static types)
        run: mypy crsmart

  qt6-check:
    name: Qt5/Qt6 compatibility checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The official QGIS pyqt5->pyqt6 checker is a self-contained AST scan; we
      # fetch it at run time (no external container needed). It exits non-zero on
      # any Qt5-only API usage.
      - name: Fetch the official Qt6 checker
        run: |
          curl -fsSL -o pyqt5_to_pyqt6.py \
            https://raw.githubusercontent.com/qgis/QGIS/master/scripts/pyqt5_to_pyqt6.py
      - name: Run Qt6 compatibility checker
        run: python pyqt5_to_pyqt6.py crsmart
      - name: Assert no direct PyQt imports (qgis.PyQt shim only)
        run: |
          if grep -rEn "^\s*(import|from)\s+PyQt(5|6)\b" crsmart; then
            echo "Direct PyQt import found; use the qgis.PyQt shim." && exit 1
          fi
          echo "OK: no direct PyQt imports."

  test:
    name: Tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'ltr' currently tracks QGIS 3.40 LTR (Qt5); 'latest' is the newest
        # release. (There is no 'release-3_40' tag on Docker Hub.) When official
        # Qt6 / QGIS 4.x images publish, add them here.
        qgis: ["ltr", "latest"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostics (python + qgis import)
        run: |
          python3 --version
          python3 -c "import qgis; print('qgis at', qgis.__file__)"
          python3 -c "import qgis.core; print('qgis.core OK')"
      - name: Install test dependencies
        run: |
          pip3 install --break-system-packages pytest pytest-qgis pytest-cov \
            || pip3 install pytest pytest-qgis pytest-cov
      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd "$GITHUB_WORKSPACE"
          xvfb-run -a python3 -m pytest -ra --cov=crsmart --cov-report=term-missing

  package:
    name: Build & verify plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build zip
        run: python scripts/build_zip.py
      - name: Verify zip structure
        run: python -m pytest tests/test_packaging.py -ra
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crsmart-plugin-zip
          path: dist/*.zip

  release:
    name: Release to QGIS plugin repository
    needs: [lint, qt6-check, test, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci
      # Publishes the tagged release to the OSGeo plugin repo + GitHub release.
      # Requires repository secrets OSGEO_USERNAME / OSGEO_PASSWORD.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          qgis-plugin-ci release "${GITHUB_REF_NAME}" \
            --github-token "${GITHUB_TOKEN}" \
            --osgeo-username "${OSGEO_USERNAME}" \
            --osgeo-password "${OSGEO_PASSWORD}"
