name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy qgis-stubs numpy pyproj types-setuptools
      - name: Ruff lint
        run: ruff check crsmart tests
      - name: Ruff format check
        run: ruff format --check crsmart tests
      - name: Mypy
        run: mypy crsmart

  qt6-check:
    name: Qt5/Qt6 compatibility checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No direct PyQt imports (qgis.PyQt shim only)
        run: |
          if grep -rEn "^[[:space:]]*(import|from)[[:space:]]+PyQt[56]\b" crsmart; then
            echo "Direct PyQt import found; use the qgis.PyQt shim." && exit 1
          fi
          echo "OK: no direct PyQt imports."
      - name: No unqualified Qt enums
        run: |
          if grep -rEn "\bQt\.(AlignCenter|AlignLeft|AlignRight|AlignTop|AlignBottom|AlignHCenter|AlignVCenter|Horizontal|Vertical|Checked|Unchecked)\b" crsmart; then
            echo "Unqualified Qt enum found; use the Qt6-style qualified enum." && exit 1
          fi
          echo "OK: no unqualified Qt enums."

  test:
    name: Tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["ltr", "latest"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostics
        run: |
          python3 --version
          python3 -c "import qgis.core; print('qgis.core OK')" || true
          python3 -c "import pyproj; print('pyproj', pyproj.__version__)" || true
      - name: Install test dependencies
        # Do NOT upgrade pip: the Debian-managed pip in the QGIS image has no
        # RECORD file, so --upgrade fails with uninstall-no-record-file. The
        # stock pip installs the deps fine (PEP 668 handled via the env var).
        run: |
          python3 -m pip install pytest pytest-qgis pytest-cov numpy pyproj
          python3 -c "import numpy, pyproj, pytest; print('deps OK')"
      - name: Run test suite
        run: |
          cd "$GITHUB_WORKSPACE"
          # PREPEND the workspace so `import crsmart` works, but KEEP the
          # container's PYTHONPATH (e.g. /usr/share/qgis/python on QGIS 4.x);
          # overwriting it removes the qgis module from sys.path.
          export PYTHONPATH="$GITHUB_WORKSPACE:${PYTHONPATH:-}"
          xvfb-run -a python3 -m pytest -ra --cov=crsmart --cov-report=term-missing

  package:
    name: Build and verify plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest numpy pyproj
      - name: Build zip
        run: python scripts/build_zip.py
      - name: Verify zip structure
        run: python -m pytest tests/test_packaging.py -ra
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crsmart-plugin-zip
          path: dist/*.zip

  release:
    name: Create GitHub release
    needs: [lint, qt6-check, test, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install qgis-plugin-ci
        run: pip install qgis-plugin-ci
      # GitHub release + plugin zip only. Omitting --osgeo-* skips the
      # plugins.qgis.org upload (no OSGeo credentials configured).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          qgis-plugin-ci release "${GITHUB_REF_NAME}" \
            --github-token "${GITHUB_TOKEN}"
