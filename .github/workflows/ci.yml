name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy qgis-stubs numpy pyproj types-setuptools
      - name: Ruff (lint)
        run: ruff check crsmart tests
      - name: Black (format check)
        run: black --check crsmart tests
      - name: Mypy (static types)
        run: mypy crsmart

  qt6-check:
    name: Qt5/Qt6 compatibility checker
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/oslandia/qgis/pyqgis-4-checker:latest
    steps:
      - uses: actions/checkout@v4
      # The Oslandia image ships the official pyqt5->pyqt6 checker. The exact
      # entrypoint is confirmed/pinned in Phase 6; see TODO.md. The build must
      # fail on any reported incompatibility.
      - name: Run Qt6 compatibility checker
        run: |
          set -euo pipefail
          if command -v pyqgis-4-checker >/dev/null 2>&1; then
            pyqgis-4-checker crsmart
          else
            python3 /opt/pyqt5_to_pyqt6.py crsmart
          fi

  test:
    name: Tests (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis:
          - "release-3_40" # QGIS 3.40 LTR (Qt5)
          - "latest"       # QGIS 4.x (Qt6)
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip3 install --break-system-packages \
            pytest pytest-qgis pytest-cov pyproj numpy || \
          pip3 install pytest pytest-qgis pytest-cov pyproj numpy
      - name: Run test suite
        run: |
          xvfb-run -a python3 -m pytest -ra --cov=crsmart --cov-report=term-missing
