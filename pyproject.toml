[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crsmart"
version = "0.1.5"
description = "Uncertainty- and epoch-aware CRS / datum transformation assistant for QGIS"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "OSMAN IBRAHIM", email = "osmangeomatics93@gmail.com" }]
keywords = ["qgis", "crs", "datum", "proj", "pyproj", "geodesy", "epoch", "helmert"]
# Runtime deps are provided by the QGIS Python environment (pyqgis, pyproj) at
# install time; numpy/pyproj are listed so the *engine* is testable standalone.
dependencies = ["pyproj>=3.4", "numpy>=1.21"]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.8",
    "qgis-stubs>=0.2.0.post1",
    "pytest>=7.4",
    "pytest-qgis>=2.0",
    "pytest-cov>=4.1",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/Osman-Geomatics93/CRSmart"
Repository = "https://github.com/Osman-Geomatics93/CRSmart"
Issues = "https://github.com/Osman-Geomatics93/CRSmart/issues"

[tool.setuptools]
packages = ["crsmart"]

# ----------------------------------------------------------------------------
# Lint / format / type
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py39"
src = ["crsmart", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "ANN", "SIM", "RUF", "TID"]
ignore = [
    "UP007",   # keep explicit Union[...] in type aliases for readability
    "TID252",  # relative imports within the plugin package are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "S101", "RUF059"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Qt portability hard rule: never import PyQt directly. Always go through the
# qgis.PyQt shim so one codebase runs on Qt5 (QGIS <= 3.44) and Qt6 (QGIS 4.x).
"PyQt5".msg = "Import Qt via 'from qgis.PyQt...' not PyQt5 directly (Qt5/Qt6 portability)."
"PyQt6".msg = "Import Qt via 'from qgis.PyQt...' not PyQt6 directly (Qt5/Qt6 portability)."

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
# qgis-stubs completeness varies by version, so a `# type: ignore` needed on one
# version can be "unused" on another. Don't fail on that (keeps CI and local in
# sync regardless of the installed qgis-stubs version).
warn_unused_ignores = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
# Engine is strictly typed; GUI/processing wrappers lean on qgis-stubs.
files = ["crsmart"]

[[tool.mypy.overrides]]
# pyproj / numpy ship partial or no stubs depending on version.
module = ["pyproj.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# QGIS-native enrichment paths are exercised only inside QGIS; stub gaps allowed.
module = ["qgis.*", "processing.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
